name: Build macOS

# This repository holds the macOS build only. The workflow it inherited from
# the pre-split tree ran nine jobs covering every platform, eight of which had
# no source left to compile and failed on every push.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck the frontend
        run: npm run typecheck

      - name: Build the frontend
        run: npx vite build

      - name: Lint the Rust backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `cargo fmt --check` is deliberately absent: the tree has never been
      # rustfmt-clean (115 hunks across 34 files), so enforcing it here would
      # fail every run until someone accepts a repo-wide reformat. clippy and
      # the tests catch defects; formatting is cosmetic.

      - name: Test the Rust backend
        working-directory: src-tauri
        run: cargo test --lib

  build:
    name: macOS (dmg,app)
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the bundle
        run: npm run tauri -- build --bundles dmg,app

      - uses: actions/upload-artifact@v4
        with:
          name: nova-macos
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Publish the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
